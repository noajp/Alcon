# Quality gates for a codebase written mostly by agents.
#
# Until now every gate was a human running commands by hand, which means the
# bar moved with whoever happened to be paying attention.
#
# Types and tests run over the whole tree. The other two are scoped to files
# the branch actually touched: the tree carries ~135 pre-existing ESLint errors
# and ~222 design-system violations, and a whole-tree gate would be red on
# every PR and ignored within a week. Scoped gates stop the bleeding now and
# let the backlog drain through dedicated cleanup PRs.
#
# Review catches what a human happened to read. Tests catch the same regression
# every time, forever — which is the only kind of gate that keeps up with the
# rate agents merge at.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: types / tests / design / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Whole-tree: these two are already green, so they stay green.
      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Changed files only — see the note at the top.
      - name: Design system
        run: node scripts/design-lint.mjs

      - name: ESLint
        run: npm run lint:changed
