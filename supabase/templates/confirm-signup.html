<!--
  Supabase Auth → Emails → Templates → "Confirm signup" の本文。
  件名: Clayware のメールアドレスを確認してください
  リンクは Supabase を経由せず Clayware の /auth/confirm に直接届き、そこで確認する。
  redirect_to は必ず最後に置く（中に ? や & を含むため。web/src/lib/emailLink.ts が読む）。
  メールソフトは CSS 変数を読まないので、色は globals.css の値をそのまま書く。
-->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>メールアドレスの確認</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f8f8;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8f8;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e5e7;border-radius:8px;">
            <tr>
              <td style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Segoe UI','Noto Sans JP',sans-serif;color:#14161a;">
                <p style="margin:0 0 24px;font-size:15px;font-weight:600;letter-spacing:0.01em;">Clayware</p>
                <h1 style="margin:0 0 12px;font-size:18px;line-height:1.5;font-weight:600;">メールアドレスを確認してください</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.8;color:#3a3c40;">
                  {{ if .Data.display_name }}{{ .Data.display_name }} さん、{{ end }}Clayware へのご登録ありがとうございます。下のボタンを押すと登録が完了し、そのまま Clayware を使い始められます。
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:6px;background:#3d5fae;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}"
                         style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;">
                        メールアドレスを確認する
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.8;color:#5a5a5c;">
                  このリンクは一度だけ使えます。時間が経つと使えなくなるので、その場合はもう一度サインアップしてください。<br />
                  心当たりがない場合は、このメールを無視してください。アカウントは作られません。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
