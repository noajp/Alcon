# Edge Functions を、main の CI が通った後に本番に出す。
#
# 出すのは、その変更で変わった関数だけ。_shared が変わったら、それを読む関数を
# すべて出す。出す前に関数ごとに型を検査し、通らない関数は出さない。
# 手で出すときは Actions の画面から "Run workflow" を押し、names に関数名を
# 空白区切りで書く（all ですべて）。Secret を入れる前に失敗した関数や、途中で
# 失敗した関数は、後の変更では出し直されないので、all で出し直す。
#
# 必要な Secret: SUPABASE_ACCESS_TOKEN（supabase.com › Account › Access Tokens）

name: Deploy Edge Functions

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      names:
        description: "出す関数（空白区切り。all ですべて）"
        required: true
        default: "all"

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    # main への push で CI が通ったとき、または手で起動したときだけ。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rkugtcqztkkacvoylupw
      # ゲートウェイの JWT 検査を外す関数。どれも自分で認証する（PAT・OAuth の
      # トークン、Webhook のトークン、cron の共有秘密、OAuth の戻り先、PC の
      # 実行役）。ここにない関数は、ゲートウェイが Supabase の JWT を求める。
      NO_VERIFY_JWT: "clayware-api clayware-mcp asset-relay audit-approvals audit-grants audit-intake automations dev-event integration-oauth"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Decide what to deploy
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.names }}
        run: |
          set -euo pipefail
          all=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared -exec basename {} \; | sort)
          if [ -n "${MANUAL:-}" ]; then
            if [ "$MANUAL" = "all" ]; then names="$all"; else names="$MANUAL"; fi
          else
            # The change that reached main: a merge commit against its first
            # parent, or a single commit against the one before it.
            changed=$(git diff --name-only HEAD^1 HEAD -- supabase/functions)
            names=$(echo "$changed" | awk -F/ 'NF>3 {print $3}' | grep -v '^_shared$' | sort -u || true)
            shared=$(echo "$changed" | grep '^supabase/functions/_shared/' || true)
            if [ -n "$shared" ]; then
              for fn in $all; do
                if grep -rqs '_shared/' "supabase/functions/$fn"; then names="$names $fn"; fi
              done
            fi
          fi
          # Functions that no longer exist are not deployed.
          keep=""
          for fn in $(echo $names | tr ' ' '\n' | sort -u); do
            if [ -f "supabase/functions/$fn/index.ts" ]; then keep="$keep $fn"; fi
          done
          echo "names=$(echo $keep)" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${keep:-(nothing)}"

      - name: Type-check
        if: steps.pick.outputs.names != ''
        run: |
          set -euo pipefail
          echo '{"nodeModulesDir":"auto"}' > "$RUNNER_TEMP/deno.json"
          failed=""
          for fn in ${{ steps.pick.outputs.names }}; do
            if ! deno check --config "$RUNNER_TEMP/deno.json" "supabase/functions/$fn/index.ts"; then failed="$failed $fn"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::型の検査に通らない関数:$failed（どれも出していません）"
            exit 1
          fi

      - name: Deploy
        if: steps.pick.outputs.names != ''
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が Secrets にありません"
            exit 1
          fi
          failed=""
          for fn in ${{ steps.pick.outputs.names }}; do
            flag=""
            case " $NO_VERIFY_JWT " in *" $fn "*) flag="--no-verify-jwt" ;; esac
            echo "::group::$fn $flag"
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api --yes $flag; then
              failed="$failed $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::デプロイに失敗した関数:$failed（all で出し直してください）"
            exit 1
          fi

      # clayware-api は GET / をトークンなしで答える。ゲートウェイの JWT 検査が
      # 残っていると 401 になり、PAT と OAuth での呼び出しがすべて断られる。
      - name: Smoke test
        if: contains(format(' {0} ', steps.pick.outputs.names), ' clayware-api ')
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$PROJECT_REF.supabase.co/functions/v1/clayware-api/")
          if [ "$code" != "200" ]; then
            echo "::error::clayware-api の GET / が $code を返しました（200 のはず）"
            exit 1
          fi
