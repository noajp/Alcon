# Quality gates for a codebase written mostly by agents.
#
# Until now every gate was a human running commands by hand, which means the
# bar moved with whoever happened to be paying attention. Worse, the Vercel
# build has `typescript.ignoreBuildErrors: true`, so nothing between an
# agent's commit and production checked types at all.
#
# Two of the three gates are ratchets scoped to files the branch actually
# touched: they only fail on a net-new violation over the base branch. That
# is deliberate — the tree carries ~135 pre-existing ESLint errors and ~225
# design-system violations, and a whole-tree gate would be red on every PR
# and ignored within a week. Ratcheted gates stop the bleeding now and let
# the backlog drain through dedicated cleanup PRs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: types / design / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Whole-tree: this one is already green, so it stays green.
      - name: Types
        run: npx tsc --noEmit

      # Changed files only — see the note at the top.
      - name: Design system
        run: node scripts/design-lint.mjs

      # Changed files only, ratcheted against the base branch — see the note
      # at the top.
      - name: ESLint (changed files)
        run: node scripts/eslint-lint.mjs
