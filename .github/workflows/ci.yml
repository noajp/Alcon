# Quality gates for a codebase written mostly by agents.
#
# Until now every gate was a human running commands by hand, which means the
# bar moved with whoever happened to be paying attention.
#
# Types and tests run over the whole tree. The other two are ratchets: they
# read the files the branch touched, compare each against its own contents on
# the base branch, and fail only on what the branch added. The tree carries
# ~135 ESLint errors and ~180 design-system violations, so a whole-tree gate
# would be red on every PR and ignored within a week — and even a file-scoped
# one fails you for opening ListTable.tsx. Ratchets stop the bleeding now,
# print the inherited backlog on the way past, and let it drain through
# dedicated cleanup PRs.
#
# Review catches what a human happened to read. Tests catch the same regression
# every time, forever — which is the only kind of gate that keeps up with the
# rate agents merge at.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: types / tests / design / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Whole-tree: these two are already green, so they stay green.
      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Changed files, against the base branch — see the note at the top.
      - name: Design system
        run: node scripts/design-lint.mjs

      - name: ESLint
        run: npm run lint:changed

      # Whole-tree, but baselined: only exports that became unreachable in this
      # PR fail. Accepting one means writing down why, in unwired-baseline.json.
      - name: Unwired exports
        run: npm run unwired-lint

  # Tell the board what happened.
  #
  # The self-build loop listens to Friction's realtime stream, so anything that
  # happens here has to be written into the database to reach it. Without this
  # the loop finds out that CI went red the next time a human looks, which is
  # the failure mode the whole event-driven rebuild exists to remove.
  #
  # Only two outcomes are worth waking anyone for: a run that failed, and main
  # moving. A green PR check is the expected case and stays silent.
  report:
    name: report to the board
    needs: gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: File the outcome as a dev_event
        if: ${{ needs.gates.result != 'success' || github.event_name == 'push' }}
        env:
          DEV_EVENT_TOKEN: ${{ secrets.DEV_EVENT_TOKEN }}
          ENDPOINT: https://rkugtcqztkkacvoylupw.supabase.co/functions/v1/dev-event
          RESULT: ${{ needs.gates.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # A checkout without the secret configured should not fail the build.
          if [ -z "$DEV_EVENT_TOKEN" ]; then
            echo "DEV_EVENT_TOKEN not set — skipping board report."
            exit 0
          fi

          if [ "$RESULT" != "success" ]; then
            KIND=ci_failed
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              REF="main"
              TITLE="main is red — $(echo "$COMMIT_MSG" | head -1)"
            else
              REF="#${PR_NUMBER}"
              TITLE="CI ${RESULT} on #${PR_NUMBER} ${PR_TITLE}"
            fi
          else
            KIND=pr_merged
            REF="main"
            TITLE="main moved — $(echo "$COMMIT_MSG" | head -1)"
          fi

          # Never fail the workflow on a reporting problem: a broken listener
          # must not also break the gate that tells us the code is broken.
          CODE=$(jq -n \
            --arg kind "$KIND" --arg ref "$REF" --arg title "$TITLE" \
            --arg url "$RUN_URL" --arg branch "$BRANCH" --arg result "$RESULT" \
            '{source:"github", kind:$kind, ref:$ref, title:$title, url:$url,
              payload:{branch:$branch, result:$result}}' \
            | curl -sS -o /tmp/dev-event.out -w '%{http_code}' \
                   -X POST "$ENDPOINT" \
                   -H "content-type: application/json" \
                   -H "x-dev-event-token: $DEV_EVENT_TOKEN" \
                   --data @- ) || CODE=000
          echo "dev-event → HTTP $CODE"
          [ "$CODE" = "200" ] || cat /tmp/dev-event.out
          exit 0
